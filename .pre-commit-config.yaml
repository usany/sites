repos:
  - repo: local
    hooks:
      - id: biome-check
        name: biome check (staged)
        entry: pnpm exec biome check --write --staged --no-errors-on-unmatched
        language: system
        files: \.(js|jsx|ts|tsx|mjs|cjs|json|css)$
        pass_filenames: false
      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: pnpm exec tsc --noEmit
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
